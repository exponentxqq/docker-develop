services:
  mysql:
    build:
      context: ../containers/services/mysql
      dockerfile: ./Dockerfile
      args:
        - MYSQL_IMAGE=${MYSQL_IMAGE}
        - MYSQL_VERSION=${MYSQL_VERSION}
    container_name: mysql
    image: docker-mysql:${MYSQL_VERSION}
    mem_limit: ${MYSQL_MEM_LIMIT:-2g}
    environment:
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - TZ=${TIMEZONE}
    volumes:
      - ${HOST_PROJECT_PATH}:${CONTAINER_PROJECT_PATH}
      - ${MYSQL_HOST_DATA_PATH}:${MYSQL_CONTAINER_DATA_PATH}
      - ${MYSQL_ENTRYPOINT_INITDB}:/docker-entrypoint-initdb.d
      - ../containers/services/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    # 放宽进程数和文件句柄限制，避免高并发时 mysql 连接/临时表耗尽默认配额
    ulimits:
      nproc: 65535
      nofile:
        soft: 26677
        hard: 46677
    ports:
      - "${MYSQL_PORT}:3306"
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  postgres:
    build:
      context: ../containers/services/postgres
      dockerfile: ./Dockerfile
      args:
        - POSTGRES_VERSION=${POSTGRES_VERSION}
    container_name: postgres
    image: docker-postgres:${POSTGRES_VERSION}
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=${TIMEZONE}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ${POSTGRES_HOST_DATA_PATH}:/var/lib/postgresql
      - ../containers/services/postgres/log:/var/log/postgresql
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  redis:
    build:
      context: ../containers/services/redis
      dockerfile: ./Dockerfile
      args:
        - REDIS_VERSION=${REDIS_VERSION}
    container_name: redis
    image: docker-redis:${REDIS_VERSION}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ../containers/services/redis/log/redis.log:/var/log/redis/redis-server.log
      - ${REDIS_HOST_DATA_PATH}:${REDIS_CONTAINER_DATA_PATH}
      - ../containers/services/redis/redis.conf:/usr/local/etc/redis/redis.conf
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  rabbitmq:
    build:
      context: ../containers/services/rabbitmq
      dockerfile: ./Dockerfile
      args:
        - RABBITMQ_VERSION=${RABBITMQ_VERSION}
    container_name: rabbitmq
    image: docker-rabbitmq:${RABBITMQ_VERSION}
    mem_limit: ${RABBITMQ_MEM_LIMIT:-512m}
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_DEFAULT_VHOST}
    ports:
      - "${RABBITMQ_AMQP_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - ${RABBITMQ_HOST_DATA_PATH}:${RABBITMQ_CONTAINER_DATA_PATH}
      - ../containers/services/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  mongo:
    build:
      context: ../containers/services/mongo
      dockerfile: Dockerfile
      args:
        - MONGO_VERSION=${MONGO_VERSION}
    container_name: mongo
    image: docker-mongo:${MONGO_VERSION}
    user: ${HOST_UID}:${HOST_GID}
    environment:
      - MONGO_DATA_DIR=${MONGO_CONTAINER_DATA_DIR}
      - MONGO_LOG_DIR=${MONGO_CONTAINER_LOG_DIR}
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    volumes:
      - ${MONGO_HOST_DATA_DIR}:${MONGO_CONTAINER_DATA_DIR}
      - ${MONGO_HOST_LOG_DIR}:${MONGO_CONTAINER_LOG_DIR}
    ports:
      - "${MONGO_PORT}:27017"
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  nginx:
    build:
      context: ../containers/services/nginx
      dockerfile: ./Dockerfile
      args:
        - NGINX_VERSION=${NGINX_VERSION}
        - PHP_FPM_PORT=${PHP_FPM_PORT}
        - HOST_UID=${HOST_UID}
        - HOST_GID=${HOST_GID}
    container_name: nginx
    image: docker-nginx:${NGINX_VERSION}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${HOST_PROJECT_PATH}:${CONTAINER_PROJECT_PATH}
      - ../containers/services/nginx/site-enabled:/etc/nginx/conf.d
      - ../containers/services/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ../containers/services/nginx/ssl:/etc/nginx/ssl
      - ../containers/services/nginx/log:/nginx/log
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  rocketmq-namesrv:
    build:
      context: ../containers/services/rocketmq
      dockerfile: ./Dockerfile
      args:
        - ROCKETMQ_VERSION=${ROCKETMQ_VERSION}
        - HOST_UID=${HOST_UID}
        - HOST_GID=${HOST_GID}
        - HOST_USER=${HOST_USER}
    container_name: rocketmq-namesrv
    image: docker-rocketmq:${ROCKETMQ_VERSION}
    user: ${HOST_UID}:${HOST_GID}
    mem_limit: ${ROCKETMQ_NAMESRV_MEM_LIMIT:-384m}
    command:
      - /home/rocketmq/start.sh
      - namesrv
    ports:
      - "${ROCKETMQ_NAMESRV_PORT}:9876"
    volumes:
      - ${ROCKETMQ_HOST_LOG_PATH}/namesrv:/home/${HOST_USER}/logs
      - ../containers/services/rocketmq/start.sh:/home/rocketmq/start.sh:ro
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  rocketmq-broker:
    build:
      context: ../containers/services/rocketmq
      dockerfile: ./Dockerfile
      args:
        - ROCKETMQ_VERSION=${ROCKETMQ_VERSION}
        - HOST_UID=${HOST_UID}
        - HOST_GID=${HOST_GID}
        - HOST_USER=${HOST_USER}
    container_name: rocketmq-broker
    image: docker-rocketmq:${ROCKETMQ_VERSION}
    user: ${HOST_UID}:${HOST_GID}
    mem_limit: ${ROCKETMQ_BROKER_MEM_LIMIT:-768m}
    command:
      - /home/rocketmq/start.sh
      - broker
    ports:
      - "${ROCKETMQ_BROKER_PORT}:10911"
    volumes:
      - ${ROCKETMQ_HOST_DATA_PATH}:/home/${HOST_USER}/store
      - ${ROCKETMQ_HOST_LOG_PATH}/broker:/home/${HOST_USER}/logs
      - ../containers/services/rocketmq/start.sh:/home/rocketmq/start.sh:ro
      - ../containers/services/rocketmq/broker.conf:/etc/rocketmq/broker.conf:ro
    depends_on:
      - rocketmq-namesrv
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend
