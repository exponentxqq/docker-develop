services:
  kubectl:
    build:
      context: ../containers/tools/kubectl
      dockerfile: Dockerfile
      args:
        - UBUNTU_VERSION=${UBUNTU_VERSION}
        - KUBECTL_VERSION=${KUBECTL_VERSION}
    container_name: kubectl
    image: docker-kubectl:${KUBECTL_VERSION}
    tty: true
    volumes:
      - ../containers/tools/kubectl/config:/root/.kube
    networks:
      backend:
        ipv4_address: 172.20.0.13

  litellm:
    build:
      context: ../containers/tools/litellm
      dockerfile: Dockerfile
    container_name: litellm
    image: docker-litellm:latest
    volumes:
      - ../containers/tools/litellm/config.yaml:/app/config.yaml
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - QWEN_API_KEY=${QWEN_API_KEY}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - ZAI_API_KEY=${ZAI_API_KEY}
      # GLM Coding Plan 等「编码订阅」走 coding 网关；按量/通用 API 在 .env 覆盖为 https://api.z.ai/api/paas/v4
      - ZAI_API_BASE=${ZAI_API_BASE:-https://api.z.ai/api/coding/paas/v4}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health/liveliness"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      backend:
        ipv4_address: 172.20.0.16

  hermes:
    build:
      context: ../containers/tools/hermes
      dockerfile: ./Dockerfile
      args:
        - HERMES_VERSION=${HERMES_VERSION}
    container_name: hermes
    image: docker-hermes:${HERMES_VERSION}
    restart: unless-stopped
    command: gateway run
    shm_size: "1gb"
    ports:
      - "${HERMES_API_PORT}:8642"
      - "${HERMES_DASHBOARD_PORT}:9119"
    volumes:
      - ${HOST_PROJECT_PATH}:${CONTAINER_PROJECT_PATH}
      - ${HERMES_HOST_DATA_PATH}:/opt/data
    environment:
      - HERMES_DASHBOARD=${HERMES_DASHBOARD}
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=7bddb36db790f0a871bbe803a2229e773d68c510ea069182f72af35ee5dec413
      - HERMES_UID=${HOST_UID}
      - HERMES_GID=${HOST_GID}
    networks:
      backend:
        ipv4_address: 172.20.0.20
