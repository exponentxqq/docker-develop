services:
  kubectl:
    build:
      context: ../containers/tools/kubectl
      dockerfile: Dockerfile
      args:
        - UBUNTU_VERSION=${UBUNTU_VERSION}
        - KUBECTL_VERSION=${KUBECTL_VERSION}
    container_name: kubectl
    image: docker-kubectl:${KUBECTL_VERSION}
    tty: true
    volumes:
      - ../containers/tools/kubectl/config:/root/.kube
      - /tmp:/tmp
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  dbx:
    build:
      context: ../containers/tools/dbx
      dockerfile: Dockerfile
      pull: true
    container_name: dbx
    image: docker-dbx
    mem_limit: ${DBX_MEM_LIMIT:-512m}
    restart: unless-stopped
    pull_policy: build
    environment:
      - DBX_DISABLE_PASSWORD=${DBX_DISABLE_PASSWORD}
    ports:
      - "${DBX_WEB_PORT}:4224"
    volumes:
      - dbx-data:/app/data
      - ${HOST_HOME}/.ssh:/root/.ssh
      - ${HOST_HOME}:${HOST_HOME}
      - /tmp:/tmp
    networks:
      - backend

  hermes:
    build:
      context: ../containers/tools/hermes
      dockerfile: ./Dockerfile
      args:
        - HERMES_VERSION=${HERMES_VERSION}
    container_name: hermes
    image: docker-hermes:${HERMES_VERSION}
    profiles: ["manual"]
    restart: unless-stopped
    command: gateway run
    shm_size: "1gb"
    mem_limit: ${HERMES_MEM_LIMIT:-8g}
    ports:
      - "${HERMES_API_PORT}:8642"
      - "${HERMES_DASHBOARD_PORT}:9119"
    volumes:
      - ${HOST_PROJECT_PATH}:${HOST_PROJECT_PATH}
      - ${HERMES_HOST_DATA_PATH}:/opt/data
      - /tmp:/tmp
    environment:
      - HERMES_DASHBOARD=${HERMES_DASHBOARD}
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=7bddb36db790f0a871bbe803a2229e773d68c510ea069182f72af35ee5dec413
      - HERMES_UID=${HOST_UID}
      - HERMES_GID=${HOST_GID}
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  dsh:
    build:
      context: ../containers/tools/dsh
      dockerfile: Dockerfile
      args:
        - NODE_VERSION=${DSH_NODE_VERSION}
        - DSH_VERSION=${DSH_VERSION}
        - DOCKER_CLI_VERSION=${DSH_DOCKER_CLI_VERSION}
        - DOCKER_COMPOSE_VERSION=${DSH_DOCKER_COMPOSE_VERSION}
        - DOCKER_BUILDX_VERSION=${DSH_DOCKER_BUILDX_VERSION}
        - HOST_UID=${HOST_UID}
        - HOST_GID=${HOST_GID}
        - HOST_USER=${HOST_USER}
    container_name: dsh
    image: docker-dsh:${DSH_VERSION}
    restart: unless-stopped
    mem_limit: ${DSH_MEM_LIMIT:-4g}
    working_dir: ${HOST_PROJECT_PATH}
    ports:
      # 唯一对外端口：本机/局域网/公网(CF 隧道回源) 三类入口统一走 dsh-pocket 代理（PIN 认证）
      # 宿主端口须与代理端口一致（局域网链接按 proxyPort 拼接，映射后原样可用）
      - "${DSH_POCKET_LAN_PORT:-3081}:${DSH_POCKET_PROXY_PORT:-3081}"
    environment:
      # dsh-pocket 初始化参数（见 entrypoint.sh）
      #   settings.json 不存在时按 TUNNEL_*/PROXY_PORT 生成；已存在则不覆盖
      #   LAN_IP 是拓扑参数：非空时每次启动同步 lanIpOverride（IP 变化改 .env 重建即可）
      - DSH_POCKET_TUNNEL_TOKEN=${DSH_POCKET_TUNNEL_TOKEN:-}
      - DSH_POCKET_TUNNEL_HOSTNAME=${DSH_POCKET_TUNNEL_HOSTNAME:-}
      - DSH_POCKET_PROXY_PORT=${DSH_POCKET_PROXY_PORT:-3081}
      - DSH_POCKET_PIN=${DSH_POCKET_PIN:-}
      - DSH_POCKET_LAN_IP=${DOCKER_HOST_IP:-}
      # 启动默认开启公网隧道（写 tunnel-auto.json 标记，插件启动自动恢复）；false = 手动关闭不跨重启
      - DSH_POCKET_TUNNEL_AUTO=${DSH_POCKET_TUNNEL_AUTO:-true}
      # 包装脚本 PATH 注入依据（entrypoint 使用）；pnpm store 三端共享配置见 entrypoint
      # （~/.config/pnpm/rc，不用 env 以避开 npm 对 pnpm 专有键的未知配置警告）
      - HOST_PROJECT_PATH=${HOST_PROJECT_PATH}
      # 空值占位：run.sh 内的 docker compose 调用会解析 DISPLAY，未设置时每次打 warning；
      # 在 `cmd 2>&1 | head` 场景该 warning 会占满管道首行并引发 SIGPIPE（输出丢失）
      - DISPLAY=${DISPLAY:-}
      # 时区与宿主/业务对齐（GMT+8）：影响会话内 date/日志时间与 git 提交时区
      - TZ=${HOST_TZ:-Asia/Shanghai}
      # web_fetch 代理出站：dsh-http-proxy 读到 http(s)_proxy 后走代理隧道、由代理远端解析目标域名，
      # 跳过本地公网 IP 校验——绕开宿主 mihomo TUN fake-ip(198.18/16) 与 SSRF 校验的正面冲突。
      # 变量为通用宿主代理配置（HOST_HTTP_PROXY，见 .env），其他容器需要时同样引用；
      # 空值时 dsh-http-proxy 视为未设置，回退直连分支。大小写成对写（undici 小写优先，dsh-http-proxy 双读）
      - HTTP_PROXY=${HOST_HTTP_PROXY:-}
      - http_proxy=${HOST_HTTP_PROXY:-}
      - HTTPS_PROXY=${HOST_HTTP_PROXY:-}
      - https_proxy=${HOST_HTTP_PROXY:-}
      # undici 按域名后缀/精确 IP 匹配（不支持 CIDR）：backend 互访走服务名，宿主回访走网关 IP
      - NO_PROXY=${HOST_NO_PROXY:-}
      - no_proxy=${HOST_NO_PROXY:-}
      # CBM 缓存库路径统一：codebase-memory 的账户 daemon 按 CBM_CACHE_DIR 路径**字符串哈希**
      # 校验缓存目录一致性（不做 realpath），宿主 daemon 与容器 MCP 必须用完全相同的字符串
      # 才能共享同一 daemon/索引库，否则报 "different cache directory" 拒连。
      # 与 volumes 的 ${CBM_DATA_PATH}:${CBM_DATA_PATH} 挂载配套。
      - CBM_CACHE_DIR=${CBM_DATA_PATH:-/data/codebase-memory-mcp}
    env_file:
      # 宿主统一密钥文件（DEEPSEEK_API_KEY / ZAI_API_KEY / OPENCODE_GO_API_KEY 等）。
      # dsh 凭据解析优先级：容器环境变量 > credentials.yaml > dotenv，故由此注入的 key 压过 UI 写入的值。
      - /home/xuqinqin/.secrets
    # socket 属组为宿主 docker 组（gid 见 .env 的 DOCKER_GID）
    group_add:
      - "${DOCKER_GID}"
    volumes:
      # profiles 子路径挂载必须位于 ${DSH_HOST_DATA_PATH} 之后，否则会被父挂载遮蔽
      - ${HOST_PROJECT_PATH}:${HOST_PROJECT_PATH}
      - ${DSH_HOST_DATA_PATH}:/home/docker/.dsh
      - ${DSH_HOST_PROFILES_PATH}:/home/docker/.dsh/profiles
      # 用户级 AGENTS.md（dsh-agent-instructions 读取 $DSH_HOME/AGENTS.md 注入会话基线），源文件由 dotfiles 管理
      - ${DSH_HOST_AGENTS_PATH}:/home/docker/.dsh/AGENTS.md:ro
      # skctl 聚合的 agent skills（自写=symlink 指 dotfiles，外部=git 拷贝），只读挂载
      - ${SKCTL_STORE_PATH}/skills:/home/docker/.agents/skills:ro
      # codebase-memory-mcp：宿主 npm 全局包目录只读挂载（镜像不再预装；/usr/local/bin 软链在 Dockerfile 预置）
      - ${CBM_HOST_PKG_PATH}:/usr/local/lib/cbm-host:ro
      # 共享索引库：与宿主同库且**同路径字符串**——CBM daemon 按路径字符串哈希校验缓存目录、
      # 不做 realpath，容器内挂载点必须与宿主访问路径完全一致（identity 挂载：源路径即目标路径），
      # 配合 environment 的 CBM_CACHE_DIR，宿主/容器共享同一 daemon 与索引库。
      # （曾因同库异名冲突：容器 /home/docker/.cache/codebase-memory-mcp vs 宿主 /data/...，
      #   dsh 容器重启令 daemon 易主后双方互拒，codebase-memory MCP 断连。）
      - ${CBM_DATA_PATH}:${CBM_DATA_PATH}
      # git 身份与宿主同源：作者信息/hooksPath(defaultBranch 等；:ro 防容器内改全局配置；
      # 宿主 git 写配置是 lock+rename 原子替换，变更后需 up -d 重建才生效）
      - ${HOST_HOME}/.gitconfig:/home/docker/.gitconfig:ro
      # 宿主密钥文件：run.sh 每次调用都会在容器内执行 `docker compose ps/up`，compose 解析
      # env_file 时该路径缺失会直接报错、包装脚本「自动拉起未运行容器」链路失效，
      # 故 identity 只读挂载（密钥本已由上方 env_file 注入 dsh 环境，此处仅补齐文件可见性）
      - ${HOST_HOME}/.secrets:/home/xuqinqin/.secrets:ro
      # pnpm store：三端共享（宿主包装 / node 容器 / dsh 容器），同路径挂载保证
      # node_modules 符号链接在各容器内均可解析
      - ${HOST_HOME}/.local/share/pnpm/store:/home/xuqinqin/.local/share/pnpm/store
      # docker socket：dsh 会话经此操作宿主 daemon（等价宿主 root 权限，见设计文档安全节）
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION}
    container_name: cloudflared
    restart: unless-stopped
    # 命名隧道 run（ingress 在 CF 面板 remote-managed，本机 tunnel 由 ~/.secrets 的 TUNNEL_TOKEN 指认）；
    # --no-autoupdate 须在子命令之前（cloudflared 2026.x 限制）
    # --protocol http2：国内/企业网常屏蔽 UDP 7844，强制走 TCP 443（与 dsh-pocket 同款参数）
    command: --no-autoupdate tunnel run --protocol http2
    env_file:
      # 宿主统一密钥文件：每机独立维护，TUNNEL_TOKEN 为本机隧道 token 的生效位
      - /home/xuqinqin/.secrets
    volumes:
      - /tmp:/tmp
    # host 网络：localhost 语义即宿主（22 sshd / 4224 dbx / 3081 dsh 均可直写 localhost 回源）
    network_mode: host
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dbx-data:
