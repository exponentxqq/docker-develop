services:
  fpm:
    build:
      context: ../containers/languages/fpm
      dockerfile: ./Dockerfile
      args:
        - PHP_VERSION=${PHP_VERSION}
        - PHP_FPM_PORT=${PHP_FPM_PORT}
        - INSTALL_COMPOSER=${PHP_INSTALL_COMPOSER}
        - INSTALL_XDEBUG=${PHP_INSTALL_XDEBUG}
        - INSTALL_REDIS=${PHP_INSTALL_REDIS}
        - INSTALL_JIEBA=${PHP_INSTALL_JIEBA}
        - INSTALL_SWOOLE=${PHP_INSTALL_SWOOLE}
        - INSTALL_IMAGICK=${PHP_INSTALL_IMAGICK}
        - IMAGICK_VERSION=${PHP_IMAGICK_VERSION}
        - INSTALL_PHALCON=${PHP_INSTALL_PHALCON}
        - PHALCON_VERSION=${PHP_PHALCON_VERSION}
        - USER_ID=${HOST_UID}
    container_name: fpm
    image: docker-fpm:${PHP_VERSION}
    working_dir: ${CONTAINER_PROJECT_PATH}
    user: ${HOST_UID}:${HOST_GID}
    ports:
      - "${PHP_FPM_PORT}:9000"
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
      - "www.qmsmain.localhost:172.20.0.3"
      - "www.auth.localhost:172.20.0.3"
    volumes:
      - ../containers/languages/fpm/conf.d:/usr/local/etc/php.conf
      - ../containers/languages/fpm/php.ini:/usr/local/etc/php/php.ini
      - ${HOST_PROJECT_PATH}:${CONTAINER_PROJECT_PATH}
      - ../cache/composer-cache:/home/docker/.composer
      - ../common/.zshrc:/home/docker/.zshrc
      - ../common/.vimrc:/home/docker/.vimrc
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      backend:
        ipv4_address: 172.20.0.7

  node:
    build:
      context: ../containers/languages/node
      dockerfile: Dockerfile
      args:
        - NODE_VERSION=${NODE_VERSION}
        - USER_ID=${HOST_UID}
    environment:
      - DISPLAY=${DISPLAY}
    container_name: node
    image: docker-node:bookworm
    user: ${HOST_UID}:${HOST_GID}
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
      - "www.auth.localhost:172.20.0.3"
      - "www.miniqms.localhost:172.20.0.3"
      - "www.template.localhost:172.20.0.3"
      - "www.qmsmain.localhost:172.20.0.3"
    volumes:
      - ../containers/languages/node/npmrc:/home/docker/.npmrc
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/shm:/dev/shm
      - ${HOST_PROJECT_PATH}:${CONTAINER_PROJECT_PATH}
      - volta-cache:/home/docker/.volta
      - ../cache/pnpm-cache:/home/docker/.local/share/pnpm/store
      - ../cache/npm-cache:/home/docker/.npm
      - ../cache/yarn-cache:/home/docker/.cache/yarn
    ports:
      - "8090-8099:8090-8099"
    devices:
      - /dev/dri:/dev/dri
    ipc: host
    tty: true
    networks:
      backend:
        ipv4_address: 172.20.0.2

  java:
    build:
      context: ../containers/languages/java
      dockerfile: Dockerfile
      args:
        - JDK_VERSION=${JDK_VERSION}
        - USER_ID=${HOST_UID}
        - BUILD_OPENCV=${BUILD_OPENCV}
    container_name: java
    image: docker-java:${JDK_VERSION}
    environment:
      - JAVA_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5750 -Xmx256m -Xms128m
    user: ${HOST_UID}:${HOST_GID}
    volumes:
      - ../containers/languages/java/run.sh:/usr/bin/run
      - ../containers/languages/java/conf:/usr/local/openjdk-11/conf
      - ${HOST_PROJECT_PATH}:${CONTAINER_PROJECT_PATH}
      - ${JDK_HOST_MAVEN_PATH}:/usr/local/maven
      - ${JDK_HOST_GRADLE_PATH}:/usr/local/gradle
      - ${JDK_HOST_JAVAFX_PATH}:/usr/local/lib/javafx
      - ../cache/gradle-cache:/home/docker/.gradle
      - ../cache/maven-cache:/home/docker/.m2
      - ../cache/javafx-cache:/home/docker/.openjfx
    extra_hosts:
      - "www.auth.localhost:172.20.0.3"
      - "dockerhost:${DOCKER_HOST_IP}"
    ports:
      - "5750:5750"
      - "8080-8089:8080-8089"
    tty: true
    networks:
      backend:
        ipv4_address: 172.20.0.9

  go:
    build:
      context: ../containers/languages/go
      dockerfile: Dockerfile
      args:
        - GO_VERSION=${GO_VERSION}
        - USER_ID=${HOST_UID}
    container_name: go
    image: docker-go
    user: ${HOST_UID}:${HOST_GID}
    volumes:
      - ${HOST_PROJECT_PATH}:${CONTAINER_PROJECT_PATH}
      - ../cache/go-cache:/go
    tty: true
    ports:
      - "3000:3000"
    networks:
      backend:
        ipv4_address: 172.20.0.10

  python:
    build:
      context: ../containers/languages/python
      dockerfile: Dockerfile
      args:
        - USER_ID=${HOST_UID}
        - CONDA_VERSION=${CONDA_VERSION}
    container_name: python
    image: docker-python:${CONDA_VERSION}
    tty: true
    user: ${HOST_UID}:${HOST_GID}
    volumes:
      - ../common/.zshrc:/home/docker/.zshrc
      - ../common/.vimrc:/home/docker/.vimrc
      - ${HOST_PROJECT_PATH}:${CONTAINER_PROJECT_PATH}
      - ../containers/languages/python/aws:/home/docker/.aws
      - ${DATA_PATH}:/data
      - conda-envs:/home/docker/.conda/envs
      - ../cache/conda-pkgs:/home/docker/.conda/pkgs
      - ../cache/uv-cache:/home/docker/.cache/uv
    ports:
      - "5000:5000"
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
    networks:
      backend:
        ipv4_address: 172.20.0.12

  rust:
    build:
      context: ../containers/languages/rust
      dockerfile: ./Dockerfile
      args:
        - RUST_VERSION=${RUST_VERSION}
        - USER_ID=${HOST_UID}
    container_name: rust
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    image: docker-rust:${RUST_VERSION}
    working_dir: ${CONTAINER_PROJECT_PATH}
    user: ${HOST_UID}:${HOST_GID}
    volumes:
      - ${HOST_PROJECT_PATH}:${CONTAINER_PROJECT_PATH}
      - ${HOST_PROJECT_PATH}:${HOST_PROJECT_PATH}
      - ../cache/cargo-cache:/home/docker/.cargo
      - ../common/.zshrc:/home/docker/.zshrc
      - ../common/.vimrc:/home/docker/.vimrc
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
    ports:
      - "3001:3001"
      - "9999:9999"
    tty: true
    networks:
      backend:
        ipv4_address: 172.20.0.15

volumes:
  volta-cache:
  conda-envs:
