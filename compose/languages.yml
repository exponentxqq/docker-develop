services:
  fpm:
    build:
      context: ../containers/languages/fpm
      dockerfile: ./Dockerfile
      args:
        - PHP_VERSION=${PHP_VERSION}
        - PHP_FPM_PORT=${PHP_FPM_PORT}
        - INSTALL_COMPOSER=${PHP_INSTALL_COMPOSER}
        - INSTALL_XDEBUG=${PHP_INSTALL_XDEBUG}
        - INSTALL_REDIS=${PHP_INSTALL_REDIS}
        - INSTALL_JIEBA=${PHP_INSTALL_JIEBA}
        - INSTALL_SWOOLE=${PHP_INSTALL_SWOOLE}
        - INSTALL_IMAGICK=${PHP_INSTALL_IMAGICK}
        - IMAGICK_VERSION=${PHP_IMAGICK_VERSION}
        - INSTALL_PHALCON=${PHP_INSTALL_PHALCON}
        - PHALCON_VERSION=${PHP_PHALCON_VERSION}
        - HOST_UID=${HOST_UID}
        - HOST_GID=${HOST_GID}
    container_name: fpm
    image: docker-fpm:${PHP_VERSION}
    working_dir: ${HOST_PROJECT_PATH}
    user: ${HOST_UID}:${HOST_GID}
    ports:
      - "${PHP_FPM_PORT}:9000"
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
    volumes:
      - ../containers/languages/fpm/conf.d:/usr/local/etc/php.conf
      - ../containers/languages/fpm/php.ini:/usr/local/etc/php/php.ini
      - ${HOST_PROJECT_PATH}:${HOST_PROJECT_PATH}
      - ../cache/composer-cache:/home/docker/.composer
      - ../common/.zshrc:/home/docker/.zshrc
      - ../common/.vimrc:/home/docker/.vimrc
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  node:
    build:
      context: ../containers/languages/node
      dockerfile: Dockerfile
      network: host
      args:
        - NODE_VERSION=${NODE_VERSION}
        - VOLTA_VERSION=${VOLTA_VERSION}
        - OCR_VERSION=${OCR_VERSION}
        - HOST_UID=${HOST_UID}
        - HOST_GID=${HOST_GID}
        - HOST_USER=${HOST_USER}
    environment:
      - DISPLAY=${DISPLAY}
    container_name: node
    image: docker-node:${VOLTA_VERSION}
    user: ${HOST_UID}:${HOST_GID}
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
    volumes:
      - ../containers/languages/node/npmrc:/home/docker/.npmrc
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/shm:/dev/shm
      - ${HOST_HOME}:${HOST_HOME}
      - volta-cache:/home/docker/.volta
      - ../cache/npm-cache:/home/docker/.npm
      - ../cache/yarn-cache:/home/docker/.cache/yarn
    ports:
      - "8090-8099:8090-8099"
    ipc: host
    tty: true
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  java:
    build:
      context: ../containers/languages/java
      dockerfile: Dockerfile
      network: host
      args:
        - HOST_UID=${HOST_UID}
        - HOST_GID=${HOST_GID}
        - HOST_USER=${HOST_USER}
        - JAVA_UBUNTU_VERSION=${JAVA_UBUNTU_VERSION}
    container_name: java
    image: docker-java:${JAVA_UBUNTU_VERSION}
    environment:
      # 时区必须与宿主/业务（GMT+8）对齐：Instant ↔ DATETIME 往返依赖 JVM 默认时区，
      # 容器缺省 UTC 会让 publishedAt 等时间字段整体偏移 8 小时（实测单测失败）
      - TZ=${HOST_TZ:-Asia/Shanghai}
    user: ${HOST_UID}:${HOST_GID}
    volumes:
      - ../common/.zshrc:/home/docker/.zshrc
      - ../common/.vimrc:/home/docker/.vimrc
      - ${HOST_PROJECT_PATH}:${HOST_PROJECT_PATH}
      # gradle/maven 缓存与宿主共享（宿主 IDEA 与容器构建同一份缓存）。daemon registry 跨
      # 宿主/容器共享偶发「daemon disappeared」属自愈型；极端时删 ~/.gradle/daemon 重建
      - ${HOST_HOME}/.gradle:/home/docker/.gradle
      - ${HOST_HOME}/.m2:/home/docker/.m2
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
    ports:
      # 8080-8089：本地应用段（dev profile 默认 8080：OPC portal-app / child-game 等；console-app 本地 8081；含历史端口）
      # 6666：management 端点（/shutdown 等）
      - "8080-8089:8080-8089"
      - "6666:6666"
    tty: true
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  go:
    build:
      context: ../containers/languages/go
      dockerfile: Dockerfile
      args:
        - GO_VERSION=${GO_VERSION}
        - HOST_UID=${HOST_UID}
        - HOST_GID=${HOST_GID}
        - HOST_USER=${HOST_USER}
    container_name: go
    image: docker-go:${GO_VERSION}
    user: ${HOST_UID}:${HOST_GID}
    mem_limit: ${GO_MEM_LIMIT:-4g}
    volumes:
      - ${HOST_HOME}:${HOST_HOME}
      - ../cache/go-cache:/go
    tty: true
    ports:
      - "3000:3000"
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  python:
    build:
      context: ../containers/languages/python
      dockerfile: Dockerfile
      args:
        - HOST_UID=${HOST_UID}
        - HOST_GID=${HOST_GID}
        - CONDA_VERSION=${CONDA_VERSION}
    container_name: python
    image: docker-python:${CONDA_VERSION}
    tty: true
    user: ${HOST_UID}:${HOST_GID}
    volumes:
      - ../common/.zshrc:/home/docker/.zshrc
      - ../common/.vimrc:/home/docker/.vimrc
      - ${HOST_PROJECT_PATH}:${HOST_PROJECT_PATH}
      - ../containers/languages/python/aws:/home/docker/.aws
      - ${DATA_PATH}:/data
      - conda-envs:/home/docker/.conda/envs
      - ../cache/conda-pkgs:/home/docker/.conda/pkgs
      - ../cache/uv-cache:/home/docker/.cache/uv
    ports:
      - "5000:5000"
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  rust:
    build:
      context: ../containers/languages/rust
      dockerfile: ./Dockerfile
      args:
        - RUST_VERSION=${RUST_VERSION}
        - HOST_UID=${HOST_UID}
        - HOST_GID=${HOST_GID}
    container_name: rust
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - RUSTC_BOOTSTRAP=1
    image: docker-rust:${RUST_VERSION}
    mem_limit: ${RUST_MEM_LIMIT:-8g}
    working_dir: ${HOST_PROJECT_PATH}
    user: ${HOST_UID}:${HOST_GID}
    volumes:
      - ${HOST_PROJECT_PATH}:${HOST_PROJECT_PATH}
      - ../cache/cargo-cache:/home/docker/.cargo
      - /usr/local/rustup:/usr/local/rustup
      - ../common/.zshrc:/home/docker/.zshrc
      - ../common/.vimrc:/home/docker/.vimrc
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
    ports:
      - "3001:3001"
      - "9999:9999"
    tty: true
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

volumes:
  volta-cache:
  conda-envs:
