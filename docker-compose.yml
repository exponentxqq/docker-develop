networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  mysql:
    build:
      context: ./mysql
      dockerfile: ./Dockerfile
      args:
        - MYSQL_IMAGE=${MYSQL_IMAGE}
        - MYSQL_VERSION=${MYSQL_VERSION}
    container_name: mysql
    image: docker-mysql:${MYSQL_VERSION}
    environment:
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - TZ=${TIMEZONE}
    volumes:
      - ${HOST_PROJECT_PATH}:${CONTAINER_PROJECT_PATH}
      - ${MYSQL_HOST_DATA_PATH}:${MYSQL_CONTAINER_DATA_PATH}
      - ${MYSQL_ENTRYPOINT_INITDB}:/docker-entrypoint-initdb.d
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    # 降低mysql容器的内存占用
    ulimits:
      nproc: 65535
      nofile:
        soft: 26677
        hard: 46677
    ports:
      - "${MYSQL_PORT}:3306"
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
    networks:
      backend:
        ipv4_address: 172.20.0.4

  postgres:
    build:
      context: ./postgres
      dockerfile: ./Dockerfile
      args:
        - POSTGRES_VERSION=${POSTGRES_VERSION}
    container_name: postgres
    image: docker-postgres:${POSTGRES_VERSION}
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=${TIMEZONE}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ${POSTGRES_HOST_DATA_PATH}:/var/lib/postgresql
      - ./postgres/log:/var/log/postgresql
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      backend:
        ipv4_address: 172.20.0.6

  redis:
    build:
      context: ./redis
      dockerfile: ./Dockerfile
      args:
        - REDIS_VERSION=${REDIS_VERSION}
    container_name: redis
    image: docker-redis:${REDIS_VERSION}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./redis/log/redis.log:/var/log/redis/redis-server.log
      - ${REDIS_HOST_DATA_PATH}:${REDIS_CONTAINER_DATA_PATH}
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      backend:
        ipv4_address: 172.20.0.5

  fpm:
    build:
      context: fpm
      dockerfile: ./Dockerfile
      args:
        - PHP_VERSION=${PHP_VERSION}
        - PHP_FPM_PORT=${PHP_FPM_PORT}
        - INSTALL_COMPOSER=${PHP_INSTALL_COMPOSER}
        - INSTALL_XDEBUG=${PHP_INSTALL_XDEBUG}
        - INSTALL_REDIS=${PHP_INSTALL_REDIS}
        - INSTALL_JIEBA=${PHP_INSTALL_JIEBA}
        - INSTALL_SWOOLE=${PHP_INSTALL_SWOOLE}
        - INSTALL_IMAGICK=${PHP_INSTALL_IMAGICK}
        - IMAGICK_VERSION=${PHP_IMAGICK_VERSION}
        - INSTALL_PHALCON=${PHP_INSTALL_PHALCON}
        - PHALCON_VERSION=${PHP_PHALCON_VERSION}
        - USER_ID=${USER_ID}
    container_name: fpm
    image: docker-fpm:${PHP_VERSION}
    working_dir: ${CONTAINER_PROJECT_PATH}
    user: ${USER_ID}:${USER_ID}
    ports:
      - "${PHP_FPM_PORT}:9000"
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
      - "www.qmsmain.localhost:172.20.0.3"
      - "www.auth.localhost:172.20.0.3"
    volumes:
      - ./fpm/conf.d:/usr/local/etc/php.conf
      - ./fpm/php.ini:/usr/local/etc/php/php.ini
      - ${HOST_PROJECT_PATH}:${CONTAINER_PROJECT_PATH}
      - ./cache/composer-cache:/home/docker/.composer
      - ./common/.zshrc:/home/docker/.zshrc
      - ./common/.vimrc:/home/docker/.vimrc
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      backend:
        ipv4_address: 172.20.0.7

  nginx:
    build:
      context: nginx
      dockerfile: ./Dockerfile
      args:
        - NGINX_VERSION=${NGINX_VERSION}
        - PHP_FPM_PORT=${PHP_FPM_PORT}
        - USER_ID=${USER_ID}
    container_name: nginx
    image: docker-nginx:${NGINX_VERSION}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${HOST_PROJECT_PATH}:${CONTAINER_PROJECT_PATH}
      - ./nginx/site-enabled:/etc/nginx/conf.d
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/log:/nginx/log
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
    networks:
      backend:
        ipv4_address: 172.20.0.3

  workspace:
    build:
      context: ./workspace
      args:
        - USER_ID=${USER_ID}
        - UBUNTU_VERSION=${UBUNTU_VERSION}
        - GIT_VERSION=${GIT_VERSION}
    container_name: workspace
    image: docker-workspace:${UBUNTU_VERSION}
    working_dir: ${CONTAINER_PROJECT_PATH}
    volumes:
      - ${HOST_PROJECT_PATH}:${CONTAINER_PROJECT_PATH}
      - /usr/bin/git:/usr/bin/git
      - ./common/.zshrc:/home/docker/.zshrc
      - ./common/.vimrc:/home/docker/.vimrc
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
    tty: true
    networks:
      backend:
        ipv4_address: 172.20.0.8

  node:
    build:
      context: ./node
      args:
        - NODE_VERSION=${NODE_VERSION}
        - PNPM_VERSION=${PNPM_VERSION}
        - USER_ID=${USER_ID}
    environment:
      - DISPLAY=${DISPLAY}
    container_name: node
    image: docker-node:${NODE_VERSION}
    user: ${USER_ID}:${USER_ID}
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
      - "www.auth.localhost:172.20.0.3"
      - "www.miniqms.localhost:172.20.0.3"
      - "www.template.localhost:172.20.0.3"
      - "www.qmsmain.localhost:172.20.0.3"
    volumes:
      - ./node/npmrc:/etc/npmrc
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/shm:/dev/shm
      - ${HOST_PROJECT_PATH}:${CONTAINER_PROJECT_PATH}
      - ./cache/npm-cache:/home/node/.npm
      - ./cache/pnpm-cache:/home/node/.local/share/pnpm/store
    ports:
      - "8090-8099:8090-8099"
    devices:
      - /dev/dri:/dev/dri
    tty: true
    networks:
      backend:
        ipv4_address: 172.20.0.2

  java:
    build:
      context: ./java
      args:
        - JDK_VERSION=${JDK_VERSION}
        - USER_ID=${USER_ID}
        - BUILD_OPENCV=${BUILD_OPENCV}
    container_name: java
    image: docker-java:${JDK_VERSION}
    environment:
      - JAVA_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5750 -Xmx256m -Xms128m
    user: ${USER_ID}:${USER_ID}
    volumes:
      - ./java/run.sh:/usr/bin/run
      - ./java/conf:/usr/local/openjdk-11/conf
      - ${HOST_PROJECT_PATH}:${CONTAINER_PROJECT_PATH}
      - ${JDK_HOST_MAVEN_PATH}:/usr/local/maven
      - ${JDK_HOST_GRADLE_PATH}:/usr/local/gradle
      - ${JDK_HOST_JAVAFX_PATH}:/usr/local/lib/javafx
      - ./cache/gradle-cache:/home/docker/.gradle
      - ./cache/maven-cache:/home/docker/.m2
      - ./cache/javafx-cache:/home/docker/.openjfx
    extra_hosts:
      - "www.auth.localhost:172.20.0.3"
      - "dockerhost:${DOCKER_HOST_IP}"
    ports:
      - "5750:5750"
      - "8080-8089:8080-8089"
    tty: true
    networks:
      backend:
        ipv4_address: 172.20.0.9

  go:
    build:
      context: ./go
    container_name: go
    image: docker-go
    volumes:
      - ${HOST_PROJECT_PATH}:${CONTAINER_PROJECT_PATH}
      - ./cache/go-cache:/usr/local/go
    tty: true
    ports:
      - "3000:3000"
    networks:
      backend:
        ipv4_address: 172.20.0.10

  mongo:
    build:
      context: ./mongo
      args:
        - MONGO_VERSION=${MONGO_VERSION}
    container_name: mongo
    image: docker-mongo:${MONGO_VERSION}
    user: ${USER_ID}:${USER_ID}
    environment:
      - MONGO_DATA_DIR=${MONGO_CONTAINER_DATA_DIR}
      - MONGO_LOG_DIR=${MONGO_CONTAINER_LOG_DIR}
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    volumes:
      - ${HOST_PROJECT_PATH}:${CONTAINER_PROJECT_PATH}
      - ${MONGO_HOST_DATA_DIR}:${MONGO_CONTAINER_DATA_DIR}
      - ${MONGO_HOST_LOG_DIR}:${MONGO_CONTAINER_LOG_DIR}
    ports:
      - "${MONGO_PORT}:27017"
    networks:
      backend:
        ipv4_address: 172.20.0.11

  python:
    build:
      context: ./python
      args:
        - USER_ID=${USER_ID}
        - CONDA_VERSION=${CONDA_VERSION}
    container_name: python
    image: docker-python:${CONDA_VERSION}
    tty: true
    user: ${USER_ID}:${USER_ID}
    volumes:
      - ./common/.zshrc:/home/docker/.zshrc
      - ./common/.vimrc:/home/docker/.vimrc
      - ${HOST_PROJECT_PATH}:${CONTAINER_PROJECT_PATH}
      - ./python/aws:/home/docker/.aws
      - ${DATA_PATH}:/data
    ports:
      - "5000:5000"
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
    networks:
      backend:
        ipv4_address: 172.20.0.12

  kubectl:
    build:
      context: ./kubectl
      args:
        - UBUNTU_VERSION=${UBUNTU_VERSION}
        - KUBECTL_VERSION=${KUBECTL_VERSION}
    container_name: kubectl
    image: docker-kubectl:${KUBECTL_VERSION}
    tty: true
    volumes:
      - ./kubectl/config:/root/.kube
    networks:
      backend:
        ipv4_address: 172.20.0.13

  rust:
    build:
      context: ./rust
      dockerfile: ./Dockerfile
      args:
        - RUST_VERSION=${RUST_VERSION}
        - USER_ID=${USER_ID}
    container_name: rust
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    image: docker-rust:${RUST_VERSION}
    working_dir: ${CONTAINER_PROJECT_PATH}
    user: ${USER_ID}:${USER_ID}
    volumes:
      - ${HOST_PROJECT_PATH}:${CONTAINER_PROJECT_PATH}
      - ${HOST_PROJECT_PATH}:${HOST_PROJECT_PATH}
      - ./rust/cargo-cache:/home/docker/.cargo
      - ./common/.zshrc:/home/docker/.zshrc
      - ./common/.vimrc:/home/docker/.vimrc
    extra_hosts:
      - "dockerhost:${DOCKER_HOST_IP}"
    ports:
      - "3001:3001"
      - "9999:9999"
    tty: true
    networks:
      backend:
        ipv4_address: 172.20.0.15

  lsp:
    build:
      context: ./lsp
      dockerfile: ./Dockerfile
    container_name: lsp
    image: docker-lsp:latest
    user: ${USER_ID}:${USER_ID}
    init: true
    tty: true
    stdin_open: true
    volumes:
      - ${HOST_PROJECT_PATH}:${HOST_PROJECT_PATH}
      - ${HOST_HOME_PATH}/.local/share/nvim:${HOST_HOME_PATH}/.local/share/nvim:ro
      - ${HOST_HOME_PATH}/.local/share/nvim/mason/share/jdtls/lombok.jar:/opt/lsp/jdtls/lombok.jar:ro
      - ${HOST_HOME_PATH}/.cache/nvim:${HOST_HOME_PATH}/.cache/nvim
      - ${HOST_HOME_PATH}/.gradle:${HOST_HOME_PATH}/.gradle
    networks:
      backend:
        ipv4_address: 172.20.0.17

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - QWEN_API_KEY=${QWEN_API_KEY}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - ZAI_API_KEY=${ZAI_API_KEY}
      # GLM Coding Plan 等「编码订阅」走 coding 网关；按量/通用 API 在 .env 覆盖为 https://api.z.ai/api/paas/v4
      - ZAI_API_BASE=${ZAI_API_BASE:-https://api.z.ai/api/coding/paas/v4}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health/liveliness"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      backend:
        ipv4_address: 172.20.0.16
